workflows:
  tncheats-ios:
    name: TnCheats Unsigned IPA for ESign
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "RegMod.xcodeproj"
        XCODE_SCHEME: "RegMod"

    scripts:
      - name: Build unsigned Release app
        script: |
          set -e
          rm -rf "$CM_BUILD_DIR/build"
          mkdir -p "$CM_BUILD_DIR/build"

          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcpretty

      - name: Package unsigned IPA for ESign
        script: |
          set -e
          PRODUCT_DIR="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH="$(find "$PRODUCT_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No Release .app was produced."
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/Payload" "$CM_BUILD_DIR/build/ESign"
          mkdir -p "$CM_BUILD_DIR/build/Payload" "$CM_BUILD_DIR/build/ESign"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/TnCheats.app"

          cd "$CM_BUILD_DIR/build"
          /usr/bin/zip -qry "ESign/TnCheats-unsigned.ipa" Payload

          echo "Created: $CM_BUILD_DIR/build/ESign/TnCheats-unsigned.ipa"

    artifacts:
      - build/ESign/TnCheats-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
